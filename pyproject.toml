[project]
name = "vectorlab"
version = "0.1.0"
description = "Extract, visualize, and edit behavior directions in transformer language models"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.1",
    "transformers==5.20.1",
    "safetensors==0.8.0",
    "huggingface_hub==2.2.0",
    "pyyaml==6.0.3",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "scikit-learn==1.9.1",
    "plotly==7.1.0",
    "scipy==1.18.1",
]

[project.scripts]
vectorlab = "vectorlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vectorlab"]

[tool.setuptools.package-data]
vectorlab = ["assets/*"]
