"/><text class="cell-text" x="682.76" y="272.0" text-anchor="middle">-66</text><text class="cell-text" x="682.76" y="289.0" text-anchor="middle" style="font-size: 11px">±21</text></g><defs><linearGradient id="scale" x1="0" x2="0" y1="0" y2="1"><stop class="stop-pos" offset="0"/><stop class="stop-mid" offset="0.5"/><stop class="stop-neg" offset="1"/></linearGradient></defs><rect x="803.76" y="120" width="10" height="186" rx="3" fill="url(#scale)"/><text class="tick" x="819.76" y="129">+0.50 SD</text><text class="tick" x="819.76" y="217.0">0</text><text class="tick" x="819.76" y="306">−0.50 SD</text></svg>