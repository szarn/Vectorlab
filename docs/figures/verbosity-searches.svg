<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img"><title>Two ways to find a verbosity direction</title><desc>Scatter of verbosity search trials for two direction types, answer length against KL.</desc><style>
:root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10); --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --neg: #e34948; --mid: #f0efec; --pos: #2a78d6; }
