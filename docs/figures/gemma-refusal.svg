<svg xmlns="http://www.w3.org/2000/svg" width="780" height="352" viewBox="0 0 780 352" role="img"><title>Gemma 3 12B refusal benchmark</title><desc>Bar charts of refusal rate and KL for Gemma 3 12B edit variants and Heretic.</desc><style>
:root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10); --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --neg: #e34948; --mid: #f0efec; --pos: #2a78d6; }
@media (prefers-color-scheme: dark) { :root { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --neg: #e66767; --mid: #383835; --pos: #3987e5; } }
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.surface { fill: var(--surface); stroke: var(--border); }
.title { fill: var(--ink); font-size: 15px; font-weight: 600; }
.subtitle, .legend, .axis-title { fill: var(--ink2); font-size: 12px; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.value { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
.note { fill: var(--ink2); font-size: 11px; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.band { fill: var(--muted); opacity: 0.16; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.thin { stroke-width: 1.5; opacity: 0.55; }
.ring { stroke: var(--surface); stroke-width: 2; }
.halo { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.s1 { stroke: var(--s1); } .s2 { stroke: var(--s2); } .s3 { stroke: var(--s3); } .s4 { stroke: var(--s4); } .smuted { stroke: var(--muted); }
.f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .f4 { fill: var(--s4); } .fmuted { fill: var(--muted); }
.cell { fill: var(--fl); }
.cell-text { fill: var(--tl); font-size: 13px; font-variant-numeric: tabular-nums; }
.stop-neg { stop-color: var(--neg); } .stop-mid { stop-color: var(--mid); } .stop-pos { stop-color: var(--pos); }
@media (prefers-color-scheme: dark) { .cell { fill: var(--fd); } .cell-text { fill: var(--td); } }
.draw { animation: draw 1.6s cubic-bezier(.3, .6, .2, 1) both; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2, .7, .2, 1) both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2, .7, .2, 1) both; }
.fade { animation: fade .6s ease-out both; }
@keyframes draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><rect class="surface" x="0.5" y="0.5" width="779" height="351" rx="12"/><text class="title" x="24" y="32">Gemma 3 12B refusal benchmark</text><text class="subtitle" x="24" y="52">google/gemma-3-12b-it · vectorlab ablation edits vs Heretic, scored with the same phrase metric and KL</text><circle class="f1" cx="32" cy="74" r="4.5"/><text class="legend" x="46" y="78">vectorlab edit</text><circle class="f2" cx="168.08" cy="74" r="4.5"/><text class="legend" x="182.08" y="78">Heretic</text><circle class="fmuted" cx="257.12" cy="74" r="4.5"/><text class="legend" x="271.12" y="78">original model</text><text class="legend" x="222" y="141.0" text-anchor="end">original</text><text class="legend" x="222" y="175.0" text-anchor="end">trial 2 · hooks</text><text class="legend" x="222" y="209.0" text-anchor="end">trial 2 · weights</text><text class="legend" x="222" y="243.0" text-anchor="end">trial 2 · weights, norms kept</text><text class="legend" x="222" y="277.0" text-anchor="end">trial 29 · weights</text><text class="legend" x="222" y="311.0" text-anchor="end">Heretic (p-e-w)</text><text class="legend" x="234" y="106" style="font-weight: 600">refusal rate, held-out (n=122)</text><line class="axis" x1="234" x2="234" y1="116" y2="324"/><path class="fmuted grow" d="M234,129.0 h196.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-196.0 z" style="animation-delay: 0.00s"/><text class="value fade" x="440.0" y="141.0" style="animation-delay: 0.60s">91.8%</text><path class="f1 grow" d="M234,163.0 h13.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-13.9 z" style="animation-delay: 0.12s"/><text class="value fade" x="257.9" y="175.0" style="animation-delay: 0.72s">8.2%</text><path class="f1 grow" d="M234,197.0 h15.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-15.6 z" style="animation-delay: 0.24s"/><text class="value fade" x="259.6" y="209.0" style="animation-delay: 0.84s">9.0%</text><path class="f1 grow" d="M234,231.0 h15.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-15.6 z" style="animation-delay: 0.36s"/><text class="value fade" x="259.6" y="243.0" style="animation-delay: 0.96s">9.0%</text><path class="f1 grow" d="M234,265.0 h10.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-10.3 z" style="animation-delay: 0.48s"/><text class="value fade" x="254.3" y="277.0" style="animation-delay: 1.08s">6.6%</text><path class="f2 grow" d="M234,299.0 h6.7 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-6.7 z" style="animation-delay: 0.60s"/><text class="value fade" x="250.7" y="311.0" style="animation-delay: 1.20s">4.9%</text><text class="legend" x="534" y="106" style="font-weight: 600">KL on neutral prompts</text><line class="axis" x1="534" x2="534" y1="116" y2="324"/><path class="fmuted grow" d="M534,129.0 h-3.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h3.0 z" style="animation-delay: 0.40s"/><text class="value fade" x="541.0" y="141.0" style="animation-delay: 1.00s">0.000</text><path class="f1 grow" d="M534,163.0 h161.2 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-161.2 z" style="animation-delay: 0.52s"/><text class="value fade" x="705.2" y="175.0" style="animation-delay: 1.12s">0.199</text><path class="f1 grow" d="M534,197.0 h158.8 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-158.8 z" style="animation-delay: 0.64s"/><text class="value fade" x="702.8" y="209.0" style="animation-delay: 1.24s">0.196</text><path class="f1 grow" d="M534,231.0 h158.4 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-158.4 z" style="animation-delay: 0.76s"/><text class="value fade" x="702.4" y="243.0" style="animation-delay: 1.36s">0.195</text><path class="f1 grow" d="M534,265.0 h83.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-83.9 z" style="animation-delay: 0.88s"/><text class="value fade" x="627.9" y="277.0" style="animation-delay: 1.48s">0.106</text><path class="f2 grow" d="M534,299.0 h115.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-115.3 z" style="animation-delay: 1.00s"/><text class="value fade" x="659.3" y="311.0" style="animation-delay: 1.60s">0.144</text></svg>