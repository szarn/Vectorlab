name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"
          uv pip install -e ".[dev]"

      - name: Run fast tests
        env:
          VECTORLAB_DEVICE: cpu
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest -m "not slow" -q
